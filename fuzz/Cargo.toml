[package]
name = "neo-decompiler-fuzz"
version = "0.0.0"
authors = ["Automatically generated"]
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# The web report surface is checked through its serialized form, because
# that is the payload the browser receives.
serde_json = "1.0"

[dependencies.neo-decompiler]
path = ".."
default-features = false
# The web report surface is a public entry point of the crate, so the fuzz
# targets that exercise it need the feature that compiles it.
features = ["web"]

[[bin]]
name = "fuzz_nef_parse"
path = "fuzz_targets/fuzz_nef_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_disassemble"
path = "fuzz_targets/fuzz_disassemble.rs"
test = false
doc = false
bench = false

