name: Publish npm Packages

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Tag to publish
        required: true
        default: v0.14.0
  push:
    tags:
      - "v*"

# Do not grant ambient permissions to every job. The package job is deliberately
# unprivileged; only the small publish job can request an npm OIDC token.
permissions: {}

concurrency:
  group: publish-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-web:
    name: Build and verify Web npm package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Match the crate's declared MSRV and use a wasm-pack release whose
      # locked dependency graph remains compatible with that toolchain.
      RUST_TOOLCHAIN: 1.86.0
      RUSTUP_TOOLCHAIN: 1.86.0
      # The locked wasm-bindgen CLI has a newer MSRV than the library it
      # processes. Compile build tools separately; keep the library on 1.86.
      BUILD_TOOLS_TOOLCHAIN: 1.88.0
      WASM_PACK_VERSION: 0.13.1
    outputs:
      filename: ${{ steps.pack.outputs.filename }}
      sha256: ${{ steps.pack.outputs.sha256 }}
      version: ${{ steps.identity.outputs.version }}
      already_published: ${{ steps.identity.outputs.already_published }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ inputs.release_ref || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Resolve the release identity
        # The crate version in Cargo.toml is the authoritative release identity:
        # it names the crates.io artifact, the Git tag, and the npm Web
        # package. The Web package version is a derived mirror of it.
        #
        # A tag cut before the version-sync commit leaves web/package.json
        # behind the crate version. Failing there would strand the release:
        # the crate is on crates.io but the npm package can never be built.
        # Deriving the Web version from the crate version publishes the
        # version the tag names instead.
        id: identity
        env:
          RELEASE_REF_NAME: ${{ inputs.release_ref || github.ref_name }}
          RELEASE_REF_TYPE: ${{ inputs.release_ref && 'tag' || github.ref_type }}
        run: |
          set -euo pipefail
          crate_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          test -n "${crate_version}"
          test "${RELEASE_REF_TYPE}" = "tag"
          test "${RELEASE_REF_NAME}" = "v${crate_version}"
          node web/scripts/sync-version.mjs --write
          node web/scripts/sync-version.mjs --check
          package_version="$(node -p "JSON.parse(require('fs').readFileSync('web/package.json','utf8')).version")"
          test "${package_version}" = "${crate_version}"
          echo "version=${crate_version}" >> "${GITHUB_OUTPUT}"
          # npm versions are immutable, so an existing version can never be
          # republished. Detecting it up front turns a hard publish failure
          # into a reusable state, which is what completing a partial release
          # requires.
          if npm view "neo-decompiler-web@${package_version}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "${GITHUB_OUTPUT}"
          else
            echo "already_published=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Install exact Rust toolchain and target
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --target wasm32-unknown-unknown
          rustup toolchain install "${BUILD_TOOLS_TOOLCHAIN}" --profile minimal
          rustc --version
          cargo --version

      - name: Install pinned wasm-pack
        run: cargo install wasm-pack --version "${WASM_PACK_VERSION}" --locked

      - name: Install wasm-bindgen-cli
        # The CLI version must match the wasm-bindgen crate version in
        # Cargo.lock. Deriving the exact version prevents CLI/crate drift.
        run: |
          version="$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)"
          test -n "${version}"
          echo "Installing wasm-bindgen-cli ${version} (matched to Cargo.lock)"
          rustup run "${BUILD_TOOLS_TOOLCHAIN}" cargo install wasm-bindgen-cli --version "${version}" --locked

      - name: Install web dependencies without lifecycle scripts
        # The version sync above rewrites the root version in package.json and
        # package-lock.json together, so the lockfile stays in sync with the
        # manifest and `npm ci` remains valid.
        working-directory: web
        run: npm ci --ignore-scripts

      - name: Run web package tests
        working-directory: web
        run: npm test

      - name: Build package once
        working-directory: web
        run: npm run build:package

      - name: Exercise the real WebAssembly bindings
        working-directory: web
        run: npm run test:wasm

      - name: Create and verify exact npm archive
        id: pack
        working-directory: web
        run: |
          node ./scripts/create-release-pack.mjs > release-pack.json
          cat release-pack.json
          filename="$(node -p "JSON.parse(require('fs').readFileSync('release-pack.json', 'utf8')).filename")"
          sha256="$(node -p "JSON.parse(require('fs').readFileSync('release-pack.json', 'utf8')).sha256")"
          test -f "${filename}"
          echo "filename=${filename}" >> "${GITHUB_OUTPUT}"
          echo "sha256=${sha256}" >> "${GITHUB_OUTPUT}"

      - name: Upload verified archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: neo-decompiler-web-package
          path: web/${{ steps.pack.outputs.filename }}
          if-no-files-found: error
          retention-days: 1

  publish-web:
    name: Publish exact Web npm archive
    needs: package-web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - name: Download verified archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: neo-decompiler-web-package
          path: release

      - name: Set up Node for trusted publishing
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Recheck archive digest
        env:
          PACKAGE_FILE: ${{ needs.package-web.outputs.filename }}
          EXPECTED_SHA256: ${{ needs.package-web.outputs.sha256 }}
        run: |
          actual_sha256="$(sha256sum "release/${PACKAGE_FILE}" | awk '{print $1}')"
          test "${actual_sha256}" = "${EXPECTED_SHA256}"

      - name: Publish verified archive
        # npm versions are immutable: republishing an existing version fails by
        # design and must not be forced. The published artifact stands as-is.
        if: needs.package-web.outputs.already_published != 'true'
        env:
          PACKAGE_FILE: ${{ needs.package-web.outputs.filename }}
          # The legacy token, when configured, is visible only to this final
          # step. Prefer npm trusted publishing so this secret can be removed.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -n "${NODE_AUTH_TOKEN:-}" ]]; then
            npm whoami
            npm publish "./release/${PACKAGE_FILE}" --ignore-scripts --provenance=false
          else
            unset NODE_AUTH_TOKEN
            npm publish "./release/${PACKAGE_FILE}" --ignore-scripts --provenance
          fi

      - name: Confirm the published Web version
        if: needs.package-web.outputs.already_published == 'true'
        env:
          PACKAGE_VERSION: ${{ needs.package-web.outputs.version }}
        run: |
          echo "neo-decompiler-web@${PACKAGE_VERSION} is already published on npm; reusing it."
          npm view "neo-decompiler-web@${PACKAGE_VERSION}" version

  package-js:
    name: Verify and pack independent JS package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      filename: ${{ steps.pack.outputs.filename }}
      sha256: ${{ steps.pack.outputs.sha256 }}
      version: ${{ steps.identity.outputs.version }}
      already_published: ${{ steps.identity.outputs.already_published }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ inputs.release_ref || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Resolve the release identity
        # The JS package is versioned independently of the Rust crate, so its
        # version is read from its own manifest. The crate version still fixes
        # which Rust release this JS package ships with, and the release tag
        # must name that crate version.
        id: identity
        env:
          RELEASE_REF_NAME: ${{ inputs.release_ref || github.ref_name }}
          RELEASE_REF_TYPE: ${{ inputs.release_ref && 'tag' || github.ref_type }}
        run: |
          set -euo pipefail
          crate_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          test -n "${crate_version}"
          test "${RELEASE_REF_TYPE}" = "tag"
          test "${RELEASE_REF_NAME}" = "v${crate_version}"
          js_version="$(node -p "JSON.parse(require('fs').readFileSync('js/package.json','utf8')).version")"
          echo "version=${js_version}" >> "${GITHUB_OUTPUT}"
          if npm view "neo-decompiler-js@${js_version}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "${GITHUB_OUTPUT}"
          else
            echo "already_published=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Verify the independent JS version mapping
        # The JS package must map to the Rust release this tag names. A row
        # that contradicts the crate version is a genuine mismatch and fails.
        # A missing row is only tolerated when the version is already on npm:
        # that artifact is immutable, so its documentation cannot be amended,
        # and the master branch carries the corrected mapping for later
        # releases.
        env:
          CRATE_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const js = JSON.parse(readFileSync('js/package.json', 'utf8'));
          const crateVersion = process.env.CRATE_VERSION;
          assert.equal(js.name, 'neo-decompiler-js');
          assert.match(js.version, /^\d+\.\d+\.\d+$/);
          for (const field of ['dependencies', 'optionalDependencies', 'peerDependencies', 'bundledDependencies']) {
            assert.equal(Object.keys(js[field] ?? {}).length, 0, `JS package must remain dependency-free: ${field}`);
          }
          const mappings = readFileSync('js/README.md', 'utf8').split('\n')
            .filter(line => line.startsWith('|')).map(line => line.split('|').map(cell => cell.trim()));
          const row = mappings.find(cells => cells[1] === js.version);
          if (row) {
            assert.equal(row[2], crateVersion,
              `js/README.md maps ${js.version} to ${row[2]}, but this release is ${crateVersion}`);
          } else {
            console.warn(`js/README.md has no row for ${js.version}; the published artifact is immutable.`);
          }
          NODE

      - name: Run standalone JS tests
        # Rust differential and external Roslyn compiler gates run in the main
        # CI workflow, which must pass on this commit before the tag is pushed.
        working-directory: js
        run: npm test

      - name: Create and verify exact JS npm archive
        id: pack
        working-directory: js
        run: |
          npm pack --ignore-scripts --json > release-pack.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { appendFileSync, readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const packs = JSON.parse(readFileSync('release-pack.json', 'utf8'));
          assert.equal(packs.length, 1);
          const pack = packs[0];
          assert.equal(pack.name, pkg.name);
          assert.equal(pack.version, pkg.version);
          assert.equal(pack.filename, `neo-decompiler-js-${pkg.version}.tgz`);
          const paths = pack.files.map(file => file.path).sort();
          assert.equal(new Set(paths).size, paths.length);
          for (const path of paths) {
            assert.ok(['package.json', 'README.md'].includes(path) ||
              /^src\/(?:[a-zA-Z0-9_-]+\/)*[a-zA-Z0-9_-]+(?:\.d\.ts|\.js)$/.test(path),
              `unexpected packed file: ${path}`);
          }
          for (const path of ['package.json', 'README.md', 'src/index.js', 'src/index.d.ts']) {
            assert.ok(paths.includes(path), `missing package entry: ${path}`);
          }
          const entries = execFileSync('tar', ['-tzf', pack.filename], { encoding: 'utf8' }).trim().split('\n').sort();
          assert.deepEqual(entries, paths.map(path => `package/${path}`).sort());
          const listing = execFileSync('tar', ['-tvzf', pack.filename], { encoding: 'utf8' }).trim().split('\n');
          assert.ok(listing.every(line => line.startsWith('-')), 'archive must contain only regular files');
          const packed = JSON.parse(execFileSync('tar', ['-xOf', pack.filename, 'package/package.json'], { encoding: 'utf8' }));
          assert.deepEqual(packed, pkg);
          const sha256 = createHash('sha256').update(readFileSync(pack.filename)).digest('hex');
          appendFileSync(process.env.GITHUB_OUTPUT, `filename=${pack.filename}\nsha256=${sha256}\n`);
          console.log(`${pack.filename}: ${paths.length} files, SHA-256 ${sha256}`);
          NODE

      - name: Smoke-test the packed public entry point
        working-directory: js
        env:
          PACKAGE_FILE: ${{ steps.pack.outputs.filename }}
        run: |
          consumer="$(mktemp -d)"
          npm install --prefix "${consumer}" --ignore-scripts --no-audit --no-fund "${PWD}/${PACKAGE_FILE}"
          cd "${consumer}"
          node --input-type=module -e "import('neo-decompiler-js').then(module => { if (typeof module.decompileBytes !== 'function') throw new Error('Missing public decompileBytes export'); })"

      - name: Upload verified JS archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: neo-decompiler-js-package
          path: js/${{ steps.pack.outputs.filename }}
          if-no-files-found: error
          retention-days: 1

  publish-js:
    name: Publish exact independent JS npm archive
    needs: package-js
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - name: Download verified JS archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: neo-decompiler-js-package
          path: release

      - name: Set up Node for trusted publishing
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Recheck JS archive digest
        env:
          PACKAGE_FILE: ${{ needs.package-js.outputs.filename }}
          EXPECTED_SHA256: ${{ needs.package-js.outputs.sha256 }}
        run: |
          actual_sha256="$(sha256sum "release/${PACKAGE_FILE}" | awk '{print $1}')"
          test "${actual_sha256}" = "${EXPECTED_SHA256}"

      - name: Publish verified JS archive
        # npm versions are immutable: republishing an existing version fails by
        # design and must not be forced. The published artifact stands as-is.
        if: needs.package-js.outputs.already_published != 'true'
        env:
          PACKAGE_FILE: ${{ needs.package-js.outputs.filename }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -n "${NODE_AUTH_TOKEN:-}" ]]; then
            npm whoami
            npm publish "./release/${PACKAGE_FILE}" --ignore-scripts --access public --provenance=false
          else
            unset NODE_AUTH_TOKEN
            npm publish "./release/${PACKAGE_FILE}" --ignore-scripts --access public --provenance
          fi

      - name: Confirm the published JS version
        if: needs.package-js.outputs.already_published == 'true'
        env:
          PACKAGE_VERSION: ${{ needs.package-js.outputs.version }}
        run: |
          echo "neo-decompiler-js@${PACKAGE_VERSION} is already published on npm; reusing it."
          npm view "neo-decompiler-js@${PACKAGE_VERSION}" version

  github-release:
    name: Create GitHub release with verified archives
    needs: [package-web, package-js, publish-web, publish-js]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_ref != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ inputs.release_ref || github.ref }}

      - name: Download verified web archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: neo-decompiler-web-package
          path: release

      - name: Download verified JS archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: neo-decompiler-js-package
          path: release

      - name: Create GitHub release
        # The release must be filed under the tag the workflow published, not
        # under the branch that happened to trigger it. A manual dispatch runs
        # from a branch, and GITHUB_REF_NAME would then name that branch.
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_ref || github.ref_name }}
        run: |
          set -euo pipefail
          test -n "${RELEASE_TAG}"
          shopt -s nullglob
          archives=(release/*.tgz)
          test "${#archives[@]}" -gt 0
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${archives[@]}" --clobber
          else
            gh release create "${RELEASE_TAG}" --title "${RELEASE_TAG}" --generate-notes "${archives[@]}"
          fi
