name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

# CI only needs to read repository contents. Jobs that need an additional
# capability opt in explicitly below.
permissions:
  contents: read

jobs:
  release-metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # This gate is deliberately its own job and deliberately cheap. It needs
    # no toolchain, no build and no network, so it reaches a verdict in
    # seconds. When it lived inside the web-package job it sat behind slow
    # steps, and a failure upstream skipped it entirely: the v0.14.3 tag was
    # cut with a Web package version that no longer matched the crate, and
    # the mismatch was never reported because the check that would have
    # caught it never ran.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Verify release metadata consistency
        # The crate version is the authoritative release identity; the Web
        # package version is derived from it and the JS package must record
        # its Rust counterpart. Drift here publishes a release whose parts
        # disagree, so this fails closed.
        run: node tools/ci/check-release-metadata.mjs

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # beta and nightly run for early warning but must not gate the build: their
    # clippy lint set changes with every toolchain release, so `-D warnings`
    # there fails on forward-looking lints unrelated to this crate. Only stable
    # (plus the separate MSRV job) gates. fail-fast is disabled so a beta/nightly
    # failure never cancels the stable run.
    continue-on-error: ${{ matrix.rust != 'stable' }}
    strategy:
      fail-fast: false
      matrix:
        rust:
          - stable
          - beta
          - nightly
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Run tests
        run: cargo test --locked --all-features --verbose
      - name: Run tests (no default features)
        if: matrix.rust == 'stable'
        run: cargo test --locked --no-default-features --verbose
      - name: Run clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Run clippy (no default features)
        if: matrix.rust == 'stable'
        run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check formatting (fuzz crate)
        # The fuzz crate is a separate workspace, so the root `cargo fmt`
        # does not reach it. Without this step its formatting can drift
        # unnoticed.
        run: cargo fmt --all --manifest-path fuzz/Cargo.toml -- --check
      - name: Build docs
        if: matrix.rust == 'stable'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: 1.86.0
      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
      - name: Run tests
        run: cargo test --locked --all-features --verbose
      - name: Run tests (no default features)
        run: cargo test --locked --no-default-features --verbose

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The benchmark profile inherits the release profile, so its artifacts
      # land in target/release next to the release build. The release profile
      # aborts on panic while the benchmark harness must be able to unwind,
      # and a target directory holding both kinds of artifacts fails to link
      # with "crate X requires panic strategy `abort` which is incompatible
      # with this crate's strategy of `unwind`". A separate target directory
      # keeps the two sets apart.
      CARGO_TARGET_DIR: target/bench
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/bench
          # A dedicated key keeps this job's cache separate from the build
          # job's. Sharing the key let the benchmark job restore a target
          # directory written by the release build, whose artifacts abort on
          # panic and therefore cannot be linked into a benchmark.
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
      - name: Run benchmarks
        run: cargo bench --locked

  deny:
    name: Cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install cargo-deny
        uses: taiki-e/install-action@04aca1d9d6d82c63188ba3f33b7f820ea39a9197 # v2
        with:
          tool: cargo-deny
      - name: Run cargo deny
        run: cargo deny check

  fuzz-corpus:
    name: Fuzz contract corpus
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The mutation-based fuzz target needs real contracts to mutate. The
    # pinned devpack set is the widest corpus available, and it is
    # extracted here so the fuzz job does not have to install the .NET
    # toolchain that the devpack sweep needs.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check out neo-devpack-dotnet v3.10.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: neo-project/neo-devpack-dotnet
          ref: v3.10.0
          path: neo-devpack-dotnet
      - name: Verify pinned devpack revision
        run: |
          expected_sha="5b0b63880b6201ae3f974cc845e93a90462d8043"
          actual_sha="$(git -C neo-devpack-dotnet rev-parse HEAD)"
          actual_tag="$(git -C neo-devpack-dotnet describe --tags --exact-match HEAD)"
          test "$actual_sha" = "$expected_sha"
          test "$actual_tag" = "v3.10.0"
      - name: Extract pinned corpus
        run: |
          python3 tools/extract_devpack_artifacts.py \
            --devpack-root neo-devpack-dotnet \
            --output-dir TestingArtifacts/devpack \
            --expected-count 103 \
            --strict \
            --clean
      - name: Upload the contract corpus
        # Only the containers and their manifests are uploaded. The
        # extracted C# sources are not needed by the fuzz targets, and they
        # are the bulk of the directory.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-contract-corpus
          path: |
            TestingArtifacts/devpack/*.nef
            TestingArtifacts/devpack/*.manifest.json
          if-no-files-found: error

  fuzz-check:
    name: Check the fuzz crate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The fuzz crate is a separate workspace, so the root lint and format
    # checks do not reach it. Without this job a defect in a fuzz target
    # sits unnoticed until a campaign trips over it.
    #
    # The job is separate from the fuzz campaign on purpose: a lint failure
    # should not cancel a campaign that is already finding coverage, and the
    # two run in parallel anyway.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-fuzz-check-${{ hashFiles('fuzz/Cargo.lock', 'Cargo.lock') }}
      - name: Check the formatting
        run: cargo fmt --all --manifest-path fuzz/Cargo.toml -- --check
      - name: Run clippy
        run: cargo clippy --locked --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The mutation-based target mutates real contracts, so the corpus has
    # to be in place before the campaign starts.
    needs: fuzz-corpus
    strategy:
      # Every target runs even when one fails, so a single crash does not hide
      # the state of the others.
      fail-fast: false
      matrix:
        target:
          - fuzz_nef_parse
          - fuzz_disassemble
          - fuzz_manifest
          - fuzz_decompile
          - fuzz_decompile_raw
          - fuzz_grammar
          - fuzz_ir_render
          - fuzz_opcode_coverage
          - fuzz_web_api
          - fuzz_config_matrix
          - fuzz_corpus_mutation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download the contract corpus
        # The corpus is loaded at runtime rather than embedded at compile
        # time, so a checkout without the contracts still builds; the
        # mutation target simply has nothing to mutate.
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fuzz-contract-corpus
          path: TestingArtifacts/devpack
      - name: Install Rust stable
        # The tool that drives the campaign is built with stable. Only the
        # fuzz targets themselves need the sanitizer runtime, and those are
        # built with nightly in the next step.
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Install cargo-fuzz
        # cargo-fuzz is not in the install-action tool list, so the action
        # would fall back to an unpinned install. It is installed directly
        # instead, with the version pinned so the campaign runs against a
        # known tool.
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Install Rust nightly
        # The nightly toolchain is installed last so it becomes the default
        # for the campaign: the targets are built with the sanitizer, which
        # needs the nightly toolchain.
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # nightly
        with:
          toolchain: nightly
      - name: Cache fuzz dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: ${{ runner.os }}-cargo-fuzz-${{ hashFiles('fuzz/Cargo.lock', 'fuzz/Cargo.toml') }}
      - name: Cache the fuzz corpus
        # The corpus is the accumulated coverage, and it is the input that
        # makes the next run stronger than the last. It is cached rather
        # than committed because it is generated data that grows with every
        # campaign. The key carries the run id so each run writes a fresh
        # entry, and the restore prefix picks up the most recent one.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-
      - name: Run the fuzz target
        # Each target gets a short, fixed budget. A long campaign belongs on
        # a dedicated fuzzing machine; CI runs a smoke campaign that catches
        # a regression which panics on the first few thousand inputs.
        #
        # The artifact prefix is set explicitly rather than passed as a
        # second corpus directory. cargo-fuzz turns the last corpus
        # directory into the artifact prefix, and a directory that holds
        # crash files would then be read back as seed inputs -- so a crash
        # that has already been fixed keeps being replayed forever.
        run: |
          mkdir -p "fuzz/corpus/${{ matrix.target }}" "fuzz/artifacts/${{ matrix.target }}"
          cd fuzz
          cargo fuzz run "${{ matrix.target }}" \
            "corpus/${{ matrix.target }}" \
            -- -max_total_time=60 -print_final_stats=1 \
            -artifact_prefix="$GITHUB_WORKSPACE/fuzz/artifacts/${{ matrix.target }}/"
      - name: Upload crash artifacts
        # A crash is worthless without the input that produced it, so the
        # artifact directory is uploaded whenever the run failed.
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
      - name: Upload the corpus
        # The corpus is the accumulated coverage. Keeping it lets the next
        # run start where this one stopped instead of rediscovering it.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: fuzz/corpus/${{ matrix.target }}/
          if-no-files-found: ignore

  security:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Security audit
        uses: rustsec/audit-check@dd51754d4e59da7395a4cd9b593f0ff2d61a9b95 # v1.4.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  artifact-sweep:
    name: Artifact sweep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Run artifact sweep
        run: bash tools/ci/artifact_sweep.sh

  devpack-corpus:
    name: Pinned devpack v3.10.0 corpus
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check out neo-devpack-dotnet v3.10.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: neo-project/neo-devpack-dotnet
          ref: v3.10.0
          path: neo-devpack-dotnet
      - name: Verify pinned devpack revision
        run: |
          expected_sha="5b0b63880b6201ae3f974cc845e93a90462d8043"
          actual_sha="$(git -C neo-devpack-dotnet rev-parse HEAD)"
          actual_tag="$(git -C neo-devpack-dotnet describe --tags --exact-match HEAD)"
          test "$actual_sha" = "$expected_sha"
          test "$actual_tag" = "v3.10.0"
      - name: Test devpack extractor
        run: python3 -m unittest discover -s tools/tests -p '*_tests.py'
      - name: Extract pinned corpus
        run: |
          python3 tools/extract_devpack_artifacts.py \
            --devpack-root neo-devpack-dotnet \
            --output-dir TestingArtifacts/devpack \
            --expected-count 103 \
            --strict \
            --clean
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Install .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Install Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-devpack-v3.10.0-${{ hashFiles('**/Cargo.lock') }}
      - name: Run pinned corpus sweep
        run: bash tools/ci/artifact_sweep.sh
      - name: Restore pinned Neo C# framework assembly
        run: |
          dotnet new classlib --framework net10.0 --output .ci/roslyn --no-restore
          dotnet add .ci/roslyn package Neo.SmartContract.Framework --version 3.10.0
          dotnet restore .ci/roslyn --nologo --verbosity quiet
          framework_dll="$(find "$HOME/.nuget/packages/neo.smartcontract.framework/3.10.0/lib/net10.0" -name Neo.SmartContract.Framework.dll -print -quit)"
          test -n "$framework_dll"
          {
            echo "NEO_SMARTCONTRACT_FRAMEWORK_DLL=$framework_dll"
            echo "NEO_CSHARP_TARGET_FRAMEWORK=net10.0"
            echo "NEO_CSHARP_CORPUS_DIR=$GITHUB_WORKSPACE/TestingArtifacts/devpack"
          } >> "$GITHUB_ENV"
      - name: Compile pinned Rust C# corpus with Roslyn
        run: cargo test --locked --test csharp_compile -- --ignored --nocapture
      - name: Compile pinned JS C# corpus with Roslyn
        working-directory: js
        run: node --test --test-name-pattern "pinned JS-generated C# corpus" test/*.test.mjs
      - name: Build release binary for differential parity gate
        # js/test/differential.test.mjs resolves RUST_BIN to
        # target/release/neo-decompiler and skips (vacuous pass) when it is
        # absent. The sweep above only exercises the dev/test profiles, so
        # build the release profile explicitly.
        run: cargo build --locked --release --features cli --bin neo-decompiler
      - name: Run Rust/JS differential parity gate
        # Recurses TestingArtifacts/ (103 pinned devpack contracts + the 7
        # committed edgecase fixtures) and asserts disasm, high-level, and the
        # analysis blocks (call_graph/xrefs/types/patterns) match byte for byte.
        working-directory: js
        run: node --test test/differential.test.mjs

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build
        run: cargo build --locked --release --verbose
      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: neo-decompiler-${{ matrix.os }}
          path: target/release/neo-decompiler*

  js-package:
    name: JS package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build release binary for differential parity gates
        # js/test/differential.test.mjs resolves RUST_BIN to
        # target/release/neo-decompiler and skips (vacuous pass) when it is
        # absent. Build it here so the Rust↔JS parity assertions actually run.
        run: cargo build --locked --release
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Run JS package tests
        working-directory: js
        run: npm test

  web-package:
    name: Web package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked
      - name: Install wasm-bindgen-cli
        # Match the wasm-bindgen crate version in Cargo.lock, otherwise
        # `wasm-pack --mode no-install` fails with "Not able to find or install
        # a local wasm-bindgen". Derive it from the lockfile so it cannot drift.
        run: |
          version="$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)"
          echo "Installing wasm-bindgen-cli ${version} (matched to Cargo.lock)"
          cargo install wasm-bindgen-cli --version "${version}" --locked
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci --ignore-scripts
      - name: Verify web package version sync
        # Runs before the slow test and build steps. When it ran last, a
        # failing test marked the job red and skipped this check, hiding the
        # very mismatch that must block a release.
        working-directory: web
        run: npm run version:check
      - name: Run web package tests
        working-directory: web
        run: npm test
      - name: Verify web package tarball contents
        working-directory: web
        run: npm run verify:pack
      - name: Exercise the real WebAssembly bindings
        working-directory: web
        run: npm run test:wasm
